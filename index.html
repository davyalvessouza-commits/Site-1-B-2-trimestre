<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Meio Ambiente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
            padding: 0;
        }

        header {
            background-color: forestgreen; /* Cor da margem/fundo do tema principal alterada para verde */
            color: white;                  /* Cor do texto alterada para branca */
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 8px 8px 0 0;
        }

        main {
            background-color: antiquewhite;
            color: black;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0 0 20px 0;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meio Ambiente</h1>
    </header>

    <main>
        <p>
            <strong>Preservação Ambiental:</strong> a importância da conservação dos recursos naturais para as futuras gerações.
        </p>
        <img src="http://googleusercontent.com/image_collection/image_retrieval/16571554298813941052_0" alt="Preservação Ambiental e Natureza">
    </main>

</body>
</html>
